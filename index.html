<div id="auth-screen" class="screen active">
    <div class="auth-card">
        <h1 style="color: var(--primary-orange); font-size: 3rem; margin-bottom: 5px;">FLICK_</h1>
        <p style="color: var(--border-color); margin-bottom: 25px; font-size: 1.2rem;">SECURE TERMINAL ACCESS</p>
        
        <div id="phone-step">
            <div style="text-align: left; margin-bottom: 15px;">
                <label style="color: var(--primary-orange); font-size: 1.2rem;">PHONE NUMBER</label>
                <input type="tel" id="phone-input" placeholder="+7 (___) ___-__-__" maxlength="18">
            </div>
            <button onclick="requestOTP()" style="width: 100%;">GET ACCESS CODE</button>
        </div>

        <div id="otp-step" style="display: none;">
            <div style="text-align: left; margin-bottom: 15px;">
                <label style="color: var(--primary-orange); font-size: 1.2rem;">SMS CODE (0000)</label>
                <input type="text" id="otp-input" placeholder="XXXX" maxlength="4" style="text-align: center; letter-spacing: 10px;">
            </div>
            <button onclick="verifyOTP()" style="width: 100%;">VERIFY & ENTER</button>
            <p onclick="resetAuth()" style="margin-top: 15px; cursor: pointer; color: #555;">Wrong number?</p>
        </div>
    </div>
</div>

<script>
    // --- AUTH LOGIC WITH PHONE ---
    let tempPhone = "";

    // Маска для телефона
    const phoneInput = document.getElementById('phone-input');
    phoneInput.addEventListener('input', (e) => {
        let x = e.target.value.replace(/\D/g, '').match(/(\d{0,1})(\d{0,3})(\d{0,3})(\d{0,2})(\d{0,2})/);
        e.target.value = !x[2] ? x[1] : '+' + x[1] + ' (' + x[2] + ') ' + x[3] + (x[4] ? '-' + x[4] : '') + (x[5] ? '-' + x[5] : '');
    });

    function requestOTP() {
        const phone = phoneInput.value;
        if (phone.length < 16) return alert("Введите полный номер телефона!");
        
        tempPhone = phone;
        document.getElementById('phone-step').style.display = 'none';
        document.getElementById('otp-step').style.display = 'block';
        
        // В реальном приложении здесь уходит запрос на бэкенд
        console.log("SMS sent to " + phone);
    }

    function verifyOTP() {
        const otp = document.getElementById('otp-input').value;
        if (otp === "0000") { // Тестовый код
            login(tempPhone);
        } else {
            alert("Неверный код! Попробуйте 0000");
        }
    }

    function resetAuth() {
        document.getElementById('phone-step').style.display = 'block';
        document.getElementById('otp-step').style.display = 'none';
    }

    function login(phoneIdentifier) {
        currentUser = phoneIdentifier;
        document.getElementById('my-name').innerText = currentUser;
        document.getElementById('auth-screen').classList.remove('active');
        document.getElementById('app-screen').classList.add('active');
        
        loadContacts();
        
        window.addEventListener('storage', (e) => {
            if(e.key === 'flick_messages') loadMessages();
        });
    }

    // Остальные функции (logout, addContact, sendMessage и т.д.) остаются прежними из предыдущего ответа
</script>
