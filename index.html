<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flick Messenger</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-orange: #FF6B35;
            --accent-orange: #FF9F1C;
            --deep-blue: #004E89;
            --sky-blue: #1A659E;
            --glass-bg: rgba(0, 78, 137, 0.25);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-white: #EFEFEF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'VT323', monospace;
            background: radial-gradient(circle at 20% 20%, var(--deep-blue), #000);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: var(--text-white);
        }

        /* --- Жидкий фон (Анимированные шары) --- */
        .background-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.8;
            animation: float 10s infinite ease-in-out;
        }

        .blob-1 {
            width: 400px;
            height: 400px;
            background: var(--primary-orange);
            top: -50px;
            left: -50px;
        }

        .blob-2 {
            width: 500px;
            height: 500px;
            background: var(--deep-blue);
            bottom: -100px;
            right: -100px;
            animation-delay: -5s;
        }

        .blob-3 {
            width: 300px;
            height: 300px;
            background: var(--accent-orange);
            top: 40%;
            left: 60%;
            animation-duration: 15s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -50px); }
        }

        /* --- Основной контейнер (Стекло) --- */
        .app-container {
            width: 90%;
            max-width: 1000px;
            height: 85vh;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* --- Эффект Scanline (8-бит ТВ) --- */
        .app-container::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
        }

        /* --- Сайдбар --- */
        .sidebar {
            width: 280px;
            background: rgba(0, 0, 0, 0.2);
            border-right: 1px solid var(--glass-border);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-size: 3rem;
            color: var(--primary-orange);
            text-shadow: 4px 4px 0px var(--deep-blue);
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .contact {
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            font-size: 1.4rem;
        }

        .contact:hover, .contact.active {
            background: rgba(255, 107, 53, 0.2); /* Orange tint */
            border: 1px solid var(--primary-orange);
            box-shadow: 0 0 10px var(--primary-orange);
        }

        .avatar {
            width: 40px;
            height: 40px;
            background: var(--sky-blue);
            margin-right: 15px;
            image-rendering: pixelated;
            border: 2px solid #fff;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.3);
        }

        /* --- Чат --- */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 5;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(0, 78, 137, 0.1);
        }

        .chat-header h2 {
            font-size: 2rem;
            color: #fff;
        }

        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Скроллбар в стиле 8-бит */
        .messages::-webkit-scrollbar {
            width: 10px;
        }
        .messages::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
        }
        .messages::-webkit-scrollbar-thumb {
            background: var(--primary-orange);
            border: 2px solid transparent;
            background-clip: content-box;
        }

        .msg {
            max-width: 70%;
            padding: 15px 20px;
            position: relative;
            font-size: 1.3rem;
            line-height: 1.4;
            /* Смесь стилей: Скругление + Пиксельная тень */
            border-radius: 15px;
            box-shadow: 6px 6px 0px rgba(0,0,0,0.2); 
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .msg-in {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
            border-bottom-left-radius: 2px;
        }

        .msg-out {
            align-self: flex-end;
            background: var(--primary-orange);
            color: #fff;
            border: 1px solid #ff8c61;
            border-bottom-right-radius: 2px;
            text-shadow: 1px 1px 0 #a83200;
        }

        /* --- Ввод сообщения --- */
        .input-area {
            padding: 20px;
            background: rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 15px;
        }

        input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid var(--sky-blue);
            color: #fff;
            padding: 15px;
            font-family: 'VT323', monospace;
            font-size: 1.5rem;
            outline: none;
            border-radius: 8px;
            box-shadow: inset 4px 4px 0 rgba(0,0,0,0.2);
        }

        input:focus {
            border-color: var(--accent-orange);
            box-shadow: 0 0 15px var(--accent-orange);
        }

        button {
            background: var(--sky-blue);
            color: #fff;
            border: none;
            padding: 0 30px;
            font-family: 'VT323', monospace;
            font-size: 1.5rem;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 4px 4px 0 var(--deep-blue);
            transition: transform 0.1s;
        }

        button:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }
        
        button:hover {
            background: var(--primary-orange);
            box-shadow: 4px 4px 0 #9e3612;
        }

    </style>
</head>
<body>

    <div class="background-blob blob-1"></div>
    <div class="background-blob blob-2"></div>
    <div class="background-blob blob-3"></div>

    <div class="app-container">
        <div class="sidebar">
            <div class="logo">Flick_</div>
            
            <div class="contact active">
                <div class="avatar"></div>
                <span>Cyber_Punk</span>
            </div>
            <div class="contact">
                <div class="avatar" style="background: var(--primary-orange)"></div>
                <span>Alice_8bit</span>
            </div>
            <div class="contact">
                <div class="avatar" style="background: #9b59b6"></div>
                <span>Neo_Matrix</span>
            </div>
        </div>

        <div class="chat-area">
            <div class="chat-header">
                <h2>@Cyber_Punk</h2>
                <span style="color: var(--primary-orange); font-size: 1.2rem;">● Online</span>
            </div>

            <div class="messages" id="messageList">
                <div class="msg msg-in">Привет! Ты видел новый дизайн Flick?</div>
                <div class="msg msg-out">Да! Оранжевый и голубой выглядят просто огонь. 🔥</div>
                <div class="msg msg-in">Стекло + пиксели = странно, но круто.</div>
            </div>

            <div class="input-area">
                <input type="text" id="msgInput" placeholder="Type a message...">
                <button onclick="sendMessage()">SEND</button>
            </div>
        </div>
    </div>

    <script>
        const messageList = document.getElementById('messageList');
        const input = document.getElementById('msgInput');

        // Автоскролл вниз при загрузке
        messageList.scrollTop = messageList.scrollHeight;

        // Отправка по Enter
        input.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        function sendMessage() {
            const text = input.value;
            if (text.trim() === "") return;

            // 1. Создаем сообщение пользователя
            addMessage(text, 'out');
            input.value = '';

            // 2. Имитация ответа "бота" через 1.5 секунды
            setTimeout(() => {
                const replies = [
                    "Звучит как отличный план! 👾",
                    "Flick — это будущее.",
                    "Лоадинг... [||||||||||] 100%",
                    "Круто, продолжай!",
                    "Пиксели рулят."
                ];
                const randomReply = replies[Math.floor(Math.random() * replies.length)];
                addMessage(randomReply, 'in');
            }, 1500);
        }

        function addMessage(text, type) {
            const div = document.createElement('div');
            div.classList.add('msg');
            div.classList.add(type === 'out' ? 'msg-out' : 'msg-in');
            div.innerText = text;
            
            messageList.appendChild(div);
            
            // Плавный скролл вниз
            messageList.scrollTo({
                top: messageList.scrollHeight,
                behavior: 'smooth'
            });
        }
    </script>
</body>
</html>
